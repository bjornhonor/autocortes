# Parâmetros do pipeline. Segredos ficam no .env.
# Chave desconhecida dá erro ao rodar qualquer comando (pega erro de digitação).

language: pt
data_dir: data

capture:
  quality: best              # qualidade pedida ao streamlink
  segment_seconds: 10        # pedaços curtos: o corte sai mais rápido na live
  retention_hours: 2         # apaga a gravação mais velha que isso (~3,5 GB/h por live em 1080p)

detect:
  window_seconds: 5          # resolução das séries de sinais
  baseline_minutes: 10       # média móvel que define o "normal" da live
  trigger_zscore: 3.0        # quantos desvios acima do normal disparam um candidato
  reaction_delay_seconds: 8  # o chat reage depois do momento; recua esse tanto
  weights:
    chat: 0.6
    audio: 0.4
  min_gap_seconds: 90        # distância mínima entre dois cortes do mesmo canal
  max_clips_per_hour: 6      # por canal
  context_before_seconds: 90 # quanto da live o juiz lê antes do pico
  context_after_seconds: 30  # e depois
  min_judge_score: 7         # nota mínima (0 a 10) do juiz para virar short

clip:
  min_seconds: 15
  max_seconds: 60
  pre_roll_seconds: 20       # sem juiz: o corte começa esse tanto antes do pico
  post_roll_seconds: 8       # e termina esse tanto depois

render:
  layout: blur               # blur | center | split | face
  width: 1080
  height: 1920
  fps: 30
  encoder: auto              # auto | libx264 | h264_nvenc
  loudness_lufs: -14         # volume padrão das redes
  facecam: null              # [x, y, w, h] da webcam no vídeo original (layout split)

captions:
  whisper_model: large-v3-turbo
  device: auto               # auto (GPU se der, senão CPU) | cpu | cuda
  compute_type: auto         # o mais rápido para o dispositivo (int8 na CPU)
  words_per_line: 3
  uppercase: true
  font: Montserrat ExtraBold # vem no pacote: src/autocortes/assets/fonts
  font_size: 88
  highlight_color: "#FFE100" # cor da palavra que está sendo falada
  margin_bottom: 560         # px acima da borda, fora da área coberta pela interface dos apps

llm:
  backend: claude-code       # assinatura do Claude, pela CLI do Claude Code (`claude -p`)
  model: claude-opus-5-5
  effort: medium             # low | medium | high | xhigh | max
  timeout_seconds: 180

publish:
  platforms: [youtube, instagram, tiktok]
  manual_review: true        # só publica depois de aprovar na fila
